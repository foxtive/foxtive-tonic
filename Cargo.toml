[workspace]
resolver = "3"
members = [
    "foxtive-tonic",
    "foxtive-tonic-examples"
]

[workspace.dependencies]
tracing = "0.1.44"
futures = "0.3.34"
# `derive` and `std` are declared here rather than left to feature unification: the
# library derives Serialize/Deserialize (grpc/responder.rs) and calls serde_json.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
# tonic's own http-body major; needed to implement http_body::Body in metrics.rs
http-body = "1"
prost = "0.14"
prost-types = "0.14"
tower = { version = "0.5", features = ["util"] }

foxtive = { version = "1.6", default-features = false, features = ["tracing-setup"] }
